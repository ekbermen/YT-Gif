name: Build GifYa APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: GifYa proje dosyalarini uret
        run: |
          mkdir -p app/src/main/java/com/ytgif/app app/src/main/assets
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'GifYa'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ytgif.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ytgif.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName '4.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="GifYa"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#7C3AED</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/ic_launcher_background</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF4FA3"
                  android:pathData="M54,54m-30,0a30,30 0 1,1 60,0a30,30 0 1,1 -60,0" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,42 Q38,38 42,38 L66,38 Q70,38 70,42 L70,60 Q70,64 66,64 L52,64 L44,72 L44,64 L42,64 Q38,64 38,60 Z" />
              <path
                  android:strokeColor="#7C3AED"
                  android:strokeWidth="3.5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M60,47 A7,7 0 1,0 61,53 L61,52 L54,52" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > app/src/main/java/com/ytgif/app/MainActivity.java << 'EOF'
          package com.ytgif.app;

          import android.animation.ObjectAnimator;
          import android.animation.PropertyValuesHolder;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.animation.AccelerateInterpolator;
          import android.view.animation.OvershootInterpolator;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.webkit.WebSettingsCompat;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.PrintWriter;
          import java.io.StringWriter;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              private WebView web;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customCb;
              private String js = "";
              private boolean desktop = true;

              private View progress;
              private View dim;
              private TextView fab;
              private LinearLayout menuBox;
              private final List<TextView> items = new ArrayList<>();
              private boolean menuOpen = false;

              private FrameLayout splash;
              private ObjectAnimator pulse;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private static final String UA_MOBILE = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
              private static final String UA_DESKTOP = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
              private static final String[] LABELS = {
                  "\uD83C\uDFE0  Ana Sayfa", "\u25C0  Geri", "\uD83D\uDD04  Yenile",
                  "\uD83C\uDF9E  GIF Paneli", "\uD83E\uDDF9  Cerezleri Temizle", "\uD83D\uDC1E  GIF Hata Kaydi",
                  "\uD83D\uDDA5  Mod"
              };

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private String home() {
                  return desktop ? "https://www.youtube.com" : "https://m.youtube.com";
              }

              private String modeLabel() {
                  return desktop ? "\uD83D\uDCF1  Mobil Moda Gec" : "\uD83D\uDDA5  Masaustu Moda Gec";
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  installCrashHandler();
                  desktop = getSharedPreferences("cfg", MODE_PRIVATE).getBoolean("desktop", true);
                  loadJs();

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);

                  setupWeb(b);
                  buildProgress();
                  buildMenu();
                  buildSplash();
                  showPrevCrash();
              }

              private void installCrashHandler() {
                  final SharedPreferences sp = getSharedPreferences("crash", MODE_PRIVATE);
                  Thread.setDefaultUncaughtExceptionHandler((t, e) -> {
                      StringWriter sw = new StringWriter();
                      e.printStackTrace(new PrintWriter(sw));
                      sp.edit().putString("trace", sw.toString()).commit();
                      android.os.Process.killProcess(android.os.Process.myPid());
                      System.exit(10);
                  });
              }

              private void showPrevCrash() {
                  final SharedPreferences sp = getSharedPreferences("crash", MODE_PRIVATE);
                  String prev = sp.getString("trace", null);
                  if (prev == null) return;
                  sp.edit().remove("trace").apply();
                  new AlertDialog.Builder(this)
                      .setTitle("Onceki calismada hata")
                      .setMessage(prev.length() > 1500 ? prev.substring(0, 1500) : prev)
                      .setPositiveButton("Tamam", null)
                      .show();
              }

              private void loadJs() {
                  try {
                      InputStream is = getAssets().open("gif.js");
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                      js = bo.toString("UTF-8");
                      is.close();
                  } catch (Exception e) { }
              }

              private void copyText(String text, String msg) {
                  ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("gifya", text));
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
              }

              // Masaustu / mobil mod ayarlari
              private void applyMode() {
                  WebSettings s = web.getSettings();
                  s.setUserAgentString(desktop ? UA_DESKTOP : UA_MOBILE);
                  s.setUseWideViewPort(desktop);
                  s.setLoadWithOverviewMode(desktop);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
              }

              private void setupWeb(Bundle b) {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  applyMode();

                  // Google'a giden "bu bir uygulama" (X-Requested-With) basligini kaldir
                  try {
                      if (WebViewFeature.isFeatureSupported(WebViewFeature.REQUESTED_WITH_HEADER_ALLOW_LIST)) {
                          WebSettingsCompat.setRequestedWithHeaderOriginAllowList(s, new HashSet<String>());
                      }
                  } catch (Exception e) { }

                  // GIF betigini sayfa yuklenmeden ONCE enjekte et (fetch'i yakalamak icin)
                  try {
                      if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                          Set<String> origins = new HashSet<>();
                          origins.add("https://m.youtube.com");
                          origins.add("https://www.youtube.com");
                          WebViewCompat.addDocumentStartJavaScript(web, js, origins);
                      }
                  } catch (Exception e) { }

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.addJavascriptInterface(new Bridge(), "AndroidGif");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri uri = r.getUrl();
                          String sch = uri.getScheme();
                          String u = uri.toString();
                          if (sch == null || (!sch.equals("http") && !sch.equals("https"))) return true;
                          if (u.contains("accounts.google.com") && u.contains("signup")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://accounts.google.com/signup")));
                                  Toast.makeText(MainActivity.this,
                                      "Hesabi tarayicida ac, sonra buraya donup giris yap", Toast.LENGTH_LONG).show();
                                  return true;
                              } catch (Exception e) { return false; }
                          }
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          super.onPageFinished(v, url);
                          if (url != null && url.contains("youtube.com")) {
                              v.evaluateJavascript(js, null);
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int p) {
                          if (progress == null) return;
                          if (p < 100) {
                              progress.animate().cancel();
                              progress.setAlpha(1f);
                              progress.animate().scaleX(p / 100f).setDuration(250).start();
                          } else {
                              progress.animate().scaleX(1f).setDuration(200).withEndAction(() ->
                                  progress.animate().alpha(0f).setDuration(300).withEndAction(() ->
                                      progress.setScaleX(0f)).start()).start();
                          }
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = view;
                          customCb = cb;
                          web.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(-1, -1));
                          getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          root.removeView(customView);
                          customView = null;
                          web.setVisibility(View.VISIBLE);
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                          if (customCb != null) customCb.onCustomViewHidden();
                      }
                  });

                  if (b == null) web.loadUrl(home());
                  else web.restoreState(b);
              }

              // ---------- Animasyonlu ilerleme cubugu ----------
              private void buildProgress() {
                  progress = new View(this);
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[]{0xFF7C3AED, 0xFFFF4FA3, 0xFF3EA6FF});
                  progress.setBackground(g);
                  progress.setPivotX(0f);
                  progress.setScaleX(0f);
                  root.addView(progress, new FrameLayout.LayoutParams(-1, dp(3), Gravity.TOP));
              }

              // ---------- Animasyonlu menu ----------
              private GradientDrawable shape(int color, int radiusDp, boolean oval) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  if (oval) g.setShape(GradientDrawable.OVAL);
                  else g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private void buildMenu() {
                  dim = new View(this);
                  dim.setBackgroundColor(0xAA000000);
                  dim.setAlpha(0f);
                  dim.setVisibility(View.GONE);
                  dim.setOnClickListener(v -> { if (menuOpen) toggleMenu(); });
                  root.addView(dim, new FrameLayout.LayoutParams(-1, -1));

                  menuBox = new LinearLayout(this);
                  menuBox.setOrientation(LinearLayout.VERTICAL);
                  menuBox.setGravity(Gravity.END);
                  FrameLayout.LayoutParams mlp = new FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM | Gravity.END);
                  mlp.setMargins(0, 0, dp(16), dp(158));
                  root.addView(menuBox, mlp);

                  for (int i = 0; i < LABELS.length; i++) {
                      final int idx = i;
                      TextView t = new TextView(this);
                      t.setText(i == 6 ? modeLabel() : LABELS[i]);
                      t.setTextColor(Color.WHITE);
                      t.setTextSize(16f);
                      t.setTypeface(Typeface.DEFAULT_BOLD);
                      t.setPadding(dp(20), dp(12), dp(20), dp(12));
                      t.setBackground(shape(0xF22A1A4D, 24, false));
                      t.setElevation(dp(6));
                      t.setVisibility(View.GONE);
                      t.setOnClickListener(v -> {
                          v.animate().scaleX(.9f).scaleY(.9f).setDuration(80).start();
                          toggleMenu();
                          onMenu(idx);
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                      lp.gravity = Gravity.END;
                      lp.bottomMargin = dp(10);
                      menuBox.addView(t, lp);
                      items.add(t);
                  }

                  fab = new TextView(this);
                  fab.setText("+");
                  fab.setTextSize(30f);
                  fab.setTextColor(Color.WHITE);
                  fab.setGravity(Gravity.CENTER);
                  fab.setBackground(shape(0xFFFF4FA3, 0, true));
                  fab.setElevation(dp(8));
                  fab.setScaleX(0f);
                  fab.setScaleY(0f);
                  fab.setOnClickListener(v -> toggleMenu());
                  FrameLayout.LayoutParams flp = new FrameLayout.LayoutParams(dp(56), dp(56), Gravity.BOTTOM | Gravity.END);
                  flp.setMargins(0, 0, dp(16), dp(90));
                  root.addView(fab, flp);
              }

              private void toggleMenu() {
                  menuOpen = !menuOpen;
                  ObjectAnimator.ofFloat(fab, "rotation", fab.getRotation(), menuOpen ? 135f : 0f)
                      .setDuration(300).start();
                  fab.animate().cancel();
                  fab.animate().scaleX(.85f).scaleY(.85f).setDuration(90).withEndAction(() ->
                      fab.animate().scaleX(1f).scaleY(1f).setDuration(260)
                          .setInterpolator(new OvershootInterpolator(3f)).start()).start();

                  final int n = items.size();
                  if (menuOpen) {
                      dim.animate().cancel();
                      dim.setVisibility(View.VISIBLE);
                      dim.animate().alpha(1f).setDuration(220).start();
                      for (int i = 0; i < n; i++) {
                          TextView t = items.get(i);
                          t.animate().cancel();
                          t.setVisibility(View.VISIBLE);
                          t.setAlpha(0f);
                          t.setTranslationY(dp(40));
                          t.setTranslationX(dp(30));
                          t.setScaleX(.5f);
                          t.setScaleY(.5f);
                          t.animate().alpha(1f).translationX(0f).translationY(0f).scaleX(1f).scaleY(1f)
                              .setStartDelay((n - 1 - i) * 55L).setDuration(320)
                              .setInterpolator(new OvershootInterpolator(1.8f)).start();
                      }
                  } else {
                      dim.animate().cancel();
                      dim.animate().alpha(0f).setDuration(200).withEndAction(() -> {
                          if (!menuOpen) dim.setVisibility(View.GONE);
                      }).start();
                      for (int i = 0; i < n; i++) {
                          final TextView t = items.get(i);
                          t.animate().cancel();
                          t.animate().alpha(0f).translationY(dp(30)).scaleX(.6f).scaleY(.6f)
                              .setStartDelay(i * 30L).setDuration(180)
                              .setInterpolator(new AccelerateInterpolator())
                              .withEndAction(() -> { if (!menuOpen) t.setVisibility(View.GONE); }).start();
                      }
                  }
              }

              private void onMenu(int idx) {
                  switch (idx) {
                      case 0: web.loadUrl(home()); break;
                      case 1: if (web.canGoBack()) web.goBack(); break;
                      case 2: web.reload(); break;
                      case 3: web.evaluateJavascript("window.__gifOpen&&window.__gifOpen()", null); break;
                      case 4:
                          CookieManager.getInstance().removeAllCookies(null);
                          CookieManager.getInstance().flush();
                          web.clearCache(true);
                          Toast.makeText(this, "Cerezler temizlendi", Toast.LENGTH_SHORT).show();
                          web.loadUrl(home());
                          break;
                      case 5: showGifLog(); break;
                      case 6:
                          desktop = !desktop;
                          getSharedPreferences("cfg", MODE_PRIVATE).edit().putBoolean("desktop", desktop).apply();
                          applyMode();
                          items.get(6).setText(modeLabel());
                          Toast.makeText(this, desktop ? "Masaustu mod" : "Mobil mod", Toast.LENGTH_SHORT).show();
                          web.loadUrl(home());
                          break;
                      default: break;
                  }
              }

              private void showGifLog() {
                  web.evaluateJavascript("(window.__gifLog||[]).join('\\n')", v -> {
                      String txt;
                      try {
                          txt = (String) new org.json.JSONTokener(v).nextValue();
                      } catch (Exception e) {
                          txt = v;
                      }
                      if (txt == null || txt.isEmpty()) txt = "Kayit yok. Once bir GIF secip yorumu gonder.";
                      final String full = txt;
                      String shown = full.length() > 3000 ? full.substring(full.length() - 3000) : full;
                      new AlertDialog.Builder(MainActivity.this)
                          .setTitle("GIF kaydi")
                          .setMessage(shown)
                          .setPositiveButton("Kopyala", (d, w) -> copyText(full, "Kayit kopyalandi"))
                          .setNegativeButton("Kapat", null)
                          .show();
                  });
              }

              // ---------- Acilis ekrani (logo + GifYa) ----------
              private void buildSplash() {
                  splash = new FrameLayout(this);
                  splash.setBackgroundColor(0xFF7C3AED);
                  splash.setClickable(true);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER);

                  final ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.ic_launcher_foreground);
                  col.addView(logo, new LinearLayout.LayoutParams(dp(200), dp(200)));

                  final TextView name = new TextView(this);
                  name.setText("GifYa");
                  name.setTextColor(Color.WHITE);
                  name.setTextSize(38f);
                  name.setTypeface(Typeface.DEFAULT_BOLD);
                  name.setLetterSpacing(0.08f);
                  col.addView(name, new LinearLayout.LayoutParams(-2, -2));

                  splash.addView(col, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));
                  root.addView(splash, new FrameLayout.LayoutParams(-1, -1));

                  logo.setScaleX(0f);
                  logo.setScaleY(0f);
                  logo.setRotation(-180f);
                  name.setAlpha(0f);
                  name.setTranslationY(dp(40));

                  logo.animate().scaleX(1f).scaleY(1f).rotation(0f).setDuration(700)
                      .setInterpolator(new OvershootInterpolator(1.6f)).withEndAction(() -> {
                          pulse = ObjectAnimator.ofPropertyValuesHolder(logo,
                              PropertyValuesHolder.ofFloat("scaleX", 1f, 1.08f),
                              PropertyValuesHolder.ofFloat("scaleY", 1f, 1.08f));
                          pulse.setDuration(500);
                          pulse.setRepeatCount(ObjectAnimator.INFINITE);
                          pulse.setRepeatMode(ObjectAnimator.REVERSE);
                          pulse.start();
                      }).start();
                  name.animate().alpha(1f).translationY(0f).setStartDelay(350).setDuration(500).start();

                  handler.postDelayed(this::hideSplash, 2000);
              }

              private void hideSplash() {
                  if (splash == null || splash.getVisibility() != View.VISIBLE) return;
                  if (pulse != null) pulse.cancel();
                  splash.animate().alpha(0f).scaleX(1.2f).scaleY(1.2f).setDuration(450).withEndAction(() -> {
                      splash.setVisibility(View.GONE);
                      fab.animate().scaleX(1f).scaleY(1f).setDuration(450)
                          .setInterpolator(new OvershootInterpolator(2.5f)).start();
                  }).start();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              public void onBackPressed() {
                  if (menuOpen) {
                      toggleMenu();
                  } else if (customView != null) {
                      web.getWebChromeClient().onHideCustomView();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private boolean okHost(String u) {
                  try {
                      URL x = new URL(u);
                      if (!"https".equals(x.getProtocol())) return false;
                      String h = x.getHost();
                      return h.equals("tenor.com") || h.endsWith(".tenor.com")
                          || h.equals("giphy.com") || h.endsWith(".giphy.com");
                  } catch (Exception e) {
                      return false;
                  }
              }

              public class Bridge {
                  @JavascriptInterface
